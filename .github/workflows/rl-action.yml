on:
  workflow_dispatch:
  push:
    branches:
      - readinglists-action
  pull_request:
      types: [closed]
      branches:
          - readinglists-action
name: Bundle and Publish Sources (Reading Lists)
jobs:
  build:
    name: Bundle and Publish Sources (Reading Lists)
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x]

    steps:
      - name: Checkout Branch
        uses: actions/checkout@v5

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - run: npm install
      - run: npm run bundle

      - name: Deploy
        uses: s0/git-publish-subdir-action@master
        env:
          REPO: self
          BRANCH: gh-pages
          FOLDER: bundles
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
